name: Build Windows .exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed so tag pushes can attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # libtorrent has Windows wheels for cp311.
          pip install libtorrent==2.0.11
          pip install pyinstaller==6.11.1

      - name: Sanity-check imports
        shell: pwsh
        run: |
          python -c "import libtorrent as lt; print('libtorrent', lt.__version__)"
          python -c "import search; print('engines:', len(search.load_engines()))"

      - name: Build .exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean pyxtorrent.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\pyxTorrent.exe)) {
            Write-Error "pyxTorrent.exe missing"
            exit 1
          }
          $size = (Get-Item .\dist\pyxTorrent.exe).Length
          Write-Host "Built pyxTorrent.exe — $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 5000000) {
            Write-Error "Binary suspiciously small ($size bytes)"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyxTorrent-windows
          path: dist/pyxTorrent.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/pyxTorrent.exe
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
